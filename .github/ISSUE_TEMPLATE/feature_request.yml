name: Feature request
description: Something Earshot should record, transcribe or summarize
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What do you want to capture, and in which situation?
      placeholder: "e.g. keep the last 5 minutes when I press the Action Button"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything you tried
